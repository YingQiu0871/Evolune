name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, must equal evoluneVersionName (e.g. 1.12.0)"
        type: string
        required: true
      publish:
        description: "Tag and publish a GitHub Release (main only)"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_CERT_SHA256_PREFIX: b9b6b955

jobs:
  build:
    # Fork PRs never get secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/.*val evoluneVersionName by extra\("([^"]+)"\).*/\1/p' build.gradle.kts | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read evoluneVersionName from build.gradle.kts."
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Unexpected evoluneVersionName format: $version"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::Input version '$INPUT_VERSION' differs from evoluneVersionName '$version' in build.gradle.kts."
            exit 1
          fi
          # On pull_request, HEAD is the merge ref; the PR head commit is what gets reviewed.
          commit="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Evolune v$version at $commit"

      - name: Check signing secrets
        env:
          EVOLUNE_KEYSTORE_BASE64: ${{ secrets.EVOLUNE_KEYSTORE_BASE64 }}
          EVOLUNE_KEYSTORE_PASSWORD: ${{ secrets.EVOLUNE_KEYSTORE_PASSWORD }}
          EVOLUNE_KEY_ALIAS: ${{ secrets.EVOLUNE_KEY_ALIAS }}
          EVOLUNE_KEY_PASSWORD: ${{ secrets.EVOLUNE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in EVOLUNE_KEYSTORE_BASE64 EVOLUNE_KEYSTORE_PASSWORD EVOLUNE_KEY_ALIAS EVOLUNE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          EVOLUNE_KEYSTORE_BASE64: ${{ secrets.EVOLUNE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/evolune-release.jks"
          printf '%s' "$EVOLUNE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::EVOLUNE_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          echo "EVOLUNE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Release APKs
        env:
          EVOLUNE_KEYSTORE_PASSWORD: ${{ secrets.EVOLUNE_KEYSTORE_PASSWORD }}
          EVOLUNE_KEY_ALIAS: ${{ secrets.EVOLUNE_KEY_ALIAS }}
          EVOLUNE_KEY_PASSWORD: ${{ secrets.EVOLUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/evolune-release.jks"

      - name: Verify and collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(ls -1 "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools."
            exit 1
          fi
          aapt2="$(ls -1 "$sdk"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)"

          shopt -s nullglob
          app_apks=(app/build/outputs/apk/release/*.apk)
          wear_apks=(wear/build/outputs/apk/release/*.apk)
          if [ "$((${#app_apks[@]} + ${#wear_apks[@]}))" -ne 2 ] || [ "${#app_apks[@]}" -ne 1 ]; then
            echo "::error::Expected 2 release APKs (1 app, 1 wear), found ${#app_apks[@]} app and ${#wear_apks[@]} wear."
            exit 1
          fi

          out=release-assets
          mkdir -p "$out"
          cp "${app_apks[0]}" "$out/Evolune-Phone-v$VERSION.apk"
          cp "${wear_apks[0]}" "$out/Evolune-Wear-v$VERSION.apk"

          report="$out/verification.txt"
          {
            echo "Evolune v$VERSION release verification"
            echo "commit: $COMMIT"
          } > "$report"
          all_match=true
          for name in "Evolune-Phone-v$VERSION.apk" "Evolune-Wear-v$VERSION.apk"; do
            apk="$out/$name"
            "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            cert="$(grep -m 1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | cut -d: -f2 | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            if [ -z "$cert" ]; then
              echo "::error::No certificate SHA-256 digest in apksigner output for $name."
              exit 1
            fi
            apk_hash="$(sha256sum "$apk" | cut -d' ' -f1)"
            case "$cert" in
              "$EXPECTED_CERT_SHA256_PREFIX"*) match=true ;;
              *) match=false; all_match=false ;;
            esac
            {
              echo ""
              echo "APK: $name"
              echo "  apk sha256 : $apk_hash"
              echo "  cert sha256: $cert"
              echo "  cert matches release identity prefix '$EXPECTED_CERT_SHA256_PREFIX': $match"
              if [ -n "$aapt2" ]; then
                "$aapt2" dump badging "$apk" | grep -m 1 -o "versionCode='[^']*' versionName='[^']*'" | sed 's/^/  /' || true
              fi
            } >> "$report"
          done

          (cd "$out" && sha256sum "Evolune-Phone-v$VERSION.apk" "Evolune-Wear-v$VERSION.apk" > SHA256SUMS.txt)

          cat "$report"
          {
            echo "### Evolune v$VERSION"
            echo '```'
            cat "$out/SHA256SUMS.txt"
            echo '```'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$all_match" != true ]; then
            echo "::error::Signing certificate does not match the release identity; do not publish these APKs."
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: evolune-release-v${{ steps.version.outputs.version }}
          path: |
            release-assets/Evolune-Phone-v${{ steps.version.outputs.version }}.apk
            release-assets/Evolune-Wear-v${{ steps.version.outputs.version }}.apk
            release-assets/SHA256SUMS.txt
            release-assets/verification.txt
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is only allowed from refs/heads/main (this run: $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: evolune-release-v${{ needs.build.outputs.version }}
          path: release-assets

      - name: Re-verify assets
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(ls -1 "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools."
            exit 1
          fi
          for name in "Evolune-Phone-v$VERSION.apk" "Evolune-Wear-v$VERSION.apk"; do
            "$apksigner" verify --print-certs "$name" > "$RUNNER_TEMP/certs.txt"
            cert="$(grep -m 1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | cut -d: -f2 | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            case "$cert" in
              "$EXPECTED_CERT_SHA256_PREFIX"*) ;;
              *) echo "::error::Certificate mismatch for $name: $cert"; exit 1 ;;
            esac
          done
          echo "Assets match SHA256SUMS.txt and the release certificate."

      - name: Check tag and Release do not exist
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ -n "$(git tag --list "$tag")" ]; then
            echo "::error::Tag $tag already exists locally."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::Tag $tag already exists on origin."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::GitHub Release $tag already exists."
            exit 1
          fi
          digits="${VERSION//./}"
          notes="docs/evolune/v$VERSION/V${digits}_RELEASE_NOTES.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes not found: $notes"
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git config user.name "盈秋"
          git config user.email "61581715+YingQiu0871@users.noreply.github.com"
          git tag -a "$tag" "$COMMIT" -m "Evolune $tag"
          git push origin "refs/tags/$tag"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          digits="${VERSION//./}"
          gh release create "$tag" --verify-tag --title "Evolune $tag" \
            --notes-file "docs/evolune/v$VERSION/V${digits}_RELEASE_NOTES.md" \
            "release-assets/Evolune-Phone-$tag.apk" \
            "release-assets/Evolune-Wear-$tag.apk" \
            "release-assets/SHA256SUMS.txt"

      - name: Verify published assets
        run: |
          set -euo pipefail
          tag="v$VERSION"
          readback="$RUNNER_TEMP/readback"
          rm -rf "$readback"
          mkdir -p "$readback"
          gh release download "$tag" --dir "$readback"
          cd "$readback"
          cmp SHA256SUMS.txt "$GITHUB_WORKSPACE/release-assets/SHA256SUMS.txt"
          sha256sum -c SHA256SUMS.txt
          echo "Read-back verified: assets match SHA256SUMS.txt."
          echo "Release: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
