name: Android Instrumented Tests

# Runs androidTest on the standard emulator (API 35, zh-CN, 1080x2400).
# Core UI classes run on every push to main and on manual dispatch; the full
# suite runs weekly or when "full" is chosen. See docs/evolune/TESTING.md.
on:
  # Validate edits to this workflow or the environment script on the PR itself.
  pull_request:
    paths:
      - ".github/workflows/android-instrumented.yml"
      - "scripts/android_test_env.sh"
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "core = Insights/Timeline/History UI classes, full = every androidTest"
        type: choice
        options:
          - core
          - full
        default: core
      locale:
        description: "Emulator locale (standard: zh-CN). en-US checks the suite does not depend on it."
        type: string
        default: zh-CN
      size:
        description: "Emulator screen size (standard: 1080x2400). 1080x1920 is the AVD default."
        type: string
        default: 1080x2400

permissions:
  contents: read

jobs:
  androidtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make scripts executable
        run: chmod +x ./gradlew scripts/android_test_env.sh

      - name: Decide scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scope }}" = "full" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=-Pandroid.testInstrumentationRunnerArguments.package=io.github.yingqiu0871.evolune.ui.screens.insights,io.github.yingqiu0871.evolune.ui.screens.timeline" >> "$GITHUB_OUTPUT"
          fi

      - name: Run androidTest on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        # Scheduled and push runs have no inputs and fall back to the standard environment.
        env:
          EVOLUNE_TEST_LOCALE: ${{ inputs.locale || 'zh-CN' }}
          EVOLUNE_TEST_SIZE: ${{ inputs.size || '1080x2400' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            ./scripts/android_test_env.sh
            ./gradlew --no-daemon :app:connectedDebugAndroidTest ${{ steps.scope.outputs.args }}

      - name: Upload androidTest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidtest-reports
          # The raw results include per-test logcat, which frame-level probes log their samples to.
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
