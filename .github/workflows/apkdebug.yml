name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Build App Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Check exported Room schemas are committed
        run: |
          # Room writes app/schemas during the build; a schema change must ship with its JSON.
          changes="$(git status --porcelain -- app/schemas)"
          if [ -n "$changes" ]; then
            echo "Uncommitted Room schema exports:"
            echo "$changes"
            git diff -- app/schemas
            git ls-files --others --exclude-standard -- app/schemas | while read -r f; do
              echo "::group::$f"; cat "$f"; echo "::endgroup::"
            done
            exit 1
          fi

      - name: Compile androidTest sources
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Build Wear Debug APK
        run: ./gradlew --no-daemon :wear:assembleDebug

      - name: Upload App and Wear Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: evolune-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
